services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    # Supabase is the only datastore, so its credentials (DATABASE_URL,
    # SUPABASE_URL, SUPABASE_SERVICE_KEY) are read from backend/.env. There is
    # no local database service.
    env_file:
      - ./backend/.env
    environment:
      # Everything else (DATABASE_URL, SUPABASE_*, SECRET_KEY, NETWORK_CIDR)
      # comes from backend/.env above; these two are container-specific.
      REDIS_URL: redis://redis:6379/0
      SNIFFING_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
