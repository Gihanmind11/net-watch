services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: netmon
      POSTGRES_PASSWORD: netmon
      POSTGRES_DB: netmon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmon -d netmon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://netmon:netmon@db:5432/netmon
      REDIS_URL: redis://redis:6379/0
      NETWORK_CIDR: ${NETWORK_CIDR:-192.168.1.0/24}
      DEMO_USER: ${DEMO_USER:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-admin}
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      SNIFFING_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
